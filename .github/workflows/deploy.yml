# Публикация (M9a): после каждого обновления main GitHub сам собирает игру
# и выкладывает её на GitHub Pages: https://oxzcc.github.io/darkstore-game/
# Один раз нужно включить в настройках репозитория: Settings → Pages → Source: GitHub Actions.
# Можно запустить и вручную: вкладка Actions → «Публикация» → Run workflow.
name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Если влили два PR подряд — старая публикация отменяется, выкладывается свежая.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Сборка для GitHub Pages
        run: npm run build -- --mode pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

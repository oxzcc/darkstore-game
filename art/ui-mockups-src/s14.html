        <polygon points="175.0,122.0 236.2,148.1 212.9,220.1 153.4,197.8 148.8,159.5" fill="#D8C6FB" stroke="#8A4FF0" stroke-width="3" stroke-linejoin="round"></polygon>

        <img src="cut/assign_lucky.png" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.8) brightness(0.92)">

        <span style="position: absolute; left: 0; top: 7px; padding: 2px 13px 2px 7px; background: #D6378A; color: #FFFFFF; font-size: 14px; font-weight: 700; clip-path: polygon(0 0, 100% 0, 86% 50%, 100% 100%, 0 100%)">КОРЖИК</span>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
.kpi { flex: 1; border: 2.5px solid var(--ink); background: var(--paper); padding: 16px 18px; text-align: center; }
.kpi .v { font-size: 46px; font-weight: 700; line-height: 1; margin-top: 8px; }
.gain { display: inline-flex; align-items: center; gap: 6px; border: 2.5px solid #7DB54A; padding: 4px 10px; font-weight: 700; font-size: 16px; background: #E4F5CF; }
.pr { flex: 1; border: 2.5px solid var(--ink); background: var(--paper); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.big-star { width: 96px; height: 96px; }
</style></head><body>
<canvas id="world" width="1920" height="1080"></canvas><div id="ui"></div>
<script src="icons.js"></script><script src="gl.js"></script><script src="world.js"></script><script src="common.js"></script><script>
document.fonts.load('700 20px X5Sans').then(()=>document.fonts.load('500 20px X5Sans')).then(()=>{
 renderWorld(CAM_MAIN,{extra:crew});
 dim(.5);
 const star=(f)=>`<svg viewBox="0 0 24 24" class="big-star"><path d="M12 1.5l3.2 6.6 7.3 1-5.3 5.1 1.3 7.3L12 18l-6.5 3.5 1.3-7.3L1.5 9.1l7.3-1z" fill="${f?'#FFC629':'#EADFC9'}" stroke="#6B6150" stroke-width="1.4" stroke-linejoin="miter"/></svg>`;
 const pr=(k,gains,n)=>`<div class="pr">${portrait(k,84)}<div style="font-size:24px;font-weight:700;letter-spacing:.03em">${PK[k].name.toUpperCase()}</div><div style="font-size:15px;font-weight:500;color:var(--ink2)">${n} заданий</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${gains}</div></div>`;
 add(`<div class="abs panel" data-check style="left:50%;top:50%;transform:translate(-50%,-50%);width:1080px">
  <div class="ph green" style="height:64px;font-size:28px;text-shadow:0 2px 0 var(--gLo)">Смена 2 завершена!</div>
  <div style="text-align:center;padding:20px 0 6px">
    <div style="display:flex;gap:8px;justify-content:center">${star(1)}${star(1)}${star(0)}</div>
    <div style="font-size:20px;font-weight:500;color:var(--ink2);margin-top:4px">Закрыто <b style="color:var(--text)">17 из 20</b> заданий</div></div>
  <div style="display:flex;gap:20px;padding:16px 30px 6px">
    <div class="kpi" data-shadow><div style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:17px;font-weight:500;color:var(--ink2)">${ic('coin',24)} Деньги</div><div class="v" style="color:var(--g)">+2 840 ₽</div></div>
    <div class="kpi" data-shadow><div style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:17px;font-weight:500;color:var(--ink2)">${ic('star',24)} Рейтинг</div><div class="v" style="color:var(--g)">+0,2</div></div>
    <div class="kpi" data-shadow style="flex:1.4"><div style="font-size:17px;font-weight:500;color:var(--ink2)">Исходы</div>
      <div style="display:flex;justify-content:space-around;margin-top:12px;font-weight:700;font-size:24px">
        <span style="display:flex;gap:6px;align-items:center">${ic('perfect',28)}11</span><span style="display:flex;gap:6px;align-items:center">${ic('errors',28)}4</span><span style="display:flex;gap:6px;align-items:center">${ic('fail',28)}2</span><span style="display:flex;gap:6px;align-items:center">${ic('late',28)}3</span></div></div>
  </div>
  <div style="display:flex;gap:20px;padding:20px 30px 6px">
    ${pr('lucky',`<span class="gain">${ic('pick',18)} Сборка +1</span><span class="gain">${ic('speedStat',18)} Скорость +1</span>`,7)}
    ${pr('korzh',`<span class="gain">${ic('writeoff',18)} Списание +1</span>`,6)}
    ${pr('buran',`<span class="gain">${ic('receive',18)} Приёмка +1</span>`,4)}
  </div>
  <div style="display:flex;justify-content:center;padding:26px 0 28px">
    <div class="btn big primary" style="width:420px">Дальше ${ic('arrowR',24,'#fff')}</div>
  </div>
 </div>`);
 voxify(); window.READY=true;});
</script></body></html>
